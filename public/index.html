<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHANEX-MD | Ultra Luxury Golden Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background: #030303; 
            color: #ffd700; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.18;
        }

        .container { 
            background: rgba(12, 12, 12, 0.85); 
            border: 2px solid rgba(255, 215, 0, 0.5); 
            border-radius: 24px; 
            padding: 35px; 
            width: 100%; 
            max-width: 480px; 
            text-align: center; 
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.25), inset 0 0 20px rgba(255, 215, 0, 0.05); 
            backdrop-filter: blur(20px); 
            position: relative; 
            z-index: 1; 
            animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .creator-profile { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px; 
            margin-bottom: 25px; 
            background: linear-gradient(135deg, rgba(40, 32, 5, 0.9), rgba(20, 16, 2, 0.9)); 
            padding: 12px 20px; 
            border-radius: 60px; 
            border: 1px solid #ffd700; 
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .creator-avatar { 
            width: 52px; 
            height: 52px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid #ffd700; 
            box-shadow: 0 0 12px #ffd700; 
        }
        .creator-info { text-align: left; }
        .creator-info h3 { font-size: 14px; color: #ffd700; font-family: 'Orbitron', sans-serif; letter-spacing: 1.5px; font-weight: 700; }
        .creator-info p { font-size: 11px; color: #e6c65c; margin-top: 2px; }

        h1 { font-family: 'Orbitron', sans-serif; color: #ffd700; font-size: 24px; margin-bottom: 5px; text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); font-weight: 900; }
        .subtitle { color: #cca300; font-size: 11px; margin-bottom: 25px; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }

        .tabs { display: flex; gap: 12px; margin-bottom: 25px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 12px; border: 1px solid rgba(255,215,0,0.2); }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: #cca300; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.4s; font-family: 'Orbitron', sans-serif; }
        .tab-btn.active { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); font-weight: 900; }

        .tab-content { display: none; animation: fadeIn 0.5s ease-in-out; }
        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 11px; color: #ffd700; margin-bottom: 8px; font-weight: 600; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        input { width: 100%; padding: 14px 18px; background: rgba(20, 18, 5, 0.8); border: 1px solid rgba(255, 215, 0, 0.4); border-radius: 12px; color: #ffd700; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); background: rgba(30, 26, 5, 0.9); }

        button.action-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #ffd700, #ff8c00); border: none; border-radius: 12px; color: #000; font-weight: 900; font-size: 14px; cursor: pointer; transition: 0.3s; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3); }
        button.action-btn:hover { opacity: 0.95; transform: translateY(-3px); box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6); }

        .result-box { margin-top: 25px; background: rgba(15, 13, 2, 0.95); border-radius: 14px; padding: 20px; display: none; border: 1px dashed #ffd700; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Clean Normal Font for Pairing Code */
        .code-display { 
            font-family: 'Inter', sans-serif; 
            font-size: 26px; 
            font-weight: 600; 
            color: #00ff66; 
            letter-spacing: 4px; 
            margin-top: 10px; 
            background: rgba(0, 255, 102, 0.08);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 102, 0.3);
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.1);
        }
        
        .timer-display { font-size: 12px; color: #ff4d4d; margin-top: 10px; font-family: 'Orbitron', sans-serif; }
        img.qr-img { max-width: 190px; border-radius: 12px; margin-top: 12px; border: 2px solid #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); animation: pulseQR 2s infinite alternate; }

        @keyframes pulseQR {
            from { transform: scale(1); box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
            to { transform: scale(1.03); box-shadow: 0 0 25px rgba(255, 215, 0, 0.7); }
        }
        
        .loader { border: 3px solid rgba(255,215,0,0.1); border-top: 3px solid #ffd700; border-radius: 50%; width: 35px; height: 35px; animation: spin 0.8s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .footer-credit { margin-top: 25px; font-size: 10px; color: #997a00; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="container">
        <div class="creator-profile">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" alt="Shanuka Umanga" class="creator-avatar">
            <div class="creator-info">
                <h3>SHANUKA UMANGA</h3>
                <p>Lead Developer & Creator</p>
            </div>
        </div>

        <h1>⚡ SHANEX-MD ⚡</h1>
        <p class="subtitle">ULTRA GOLDEN MATRIX HUB</p>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('pairing')">Pairing Code</button>
            <button class="tab-btn" onclick="switchTab('qr')">QR Code</button>
        </div>

        <div id="pairingTab" class="tab-content active">
            <div class="input-group">
                <label>WhatsApp Number (with Country Code)</label>
                <input type="text" id="phone" placeholder="e.g., 9477xxxxxxx">
            </div>
            <button class="action-btn" onclick="getPairingCode()">GET PAIRING CODE</button>
        </div>

        <div id="qrTab" class="tab-content">
            <button class="action-btn" onclick="getQRCode()">GENERATE QR CODE</button>
        </div>
        
        <div class="loader" id="loader"></div>

        <div class="result-box" id="resultBox">
            <div id="resultContent"></div>
        </div>

        <div class="footer-credit">POWERED BY SHANEX-MD SYSTEM</div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const characters = '01SHANEXMDGOLDEN⚡🔥9477';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffd700';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        let countdownInterval;

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            clearInterval(countdownInterval);
            
            if(tab === 'pairing') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('pairingTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('qrTab').classList.add('active');
            }
            document.getElementById('resultBox').style.display = 'none';
        }

        async function getPairingCode() {
            let phone = document.getElementById('phone').value.trim();
            let loader = document.getElementById('loader');
            let resultBox = document.getElementById('resultBox');
            let resultContent = document.getElementById('resultContent');

            if (!phone) {
                alert('Please enter your WhatsApp number first!');
                return;
            }

            loader.style.display = 'block';
            resultBox.style.display = 'none';
            resultContent.innerHTML = '';
            clearInterval(countdownInterval);

            try {
                let res = await fetch(`/pair?number=${phone}&type=pairing`);
                let data = await res.json();
                
                loader.style.display = 'none';
                resultBox.style.display = 'block';

                if (data.code) {
                    let timeLeft = 60;
                    resultContent.innerHTML = `
                        <span style="font-size:11px; color:#ffd700; font-family:'Orbitron'; letter-spacing:1px;">Your Pairing Code:</span>
                        <div class="code-display">${data.code}</div>
                        <div class="timer-display" id="timer">Code expires in: ${timeLeft}s</div>
                        <p style="margin-top:10px; font-size:11px; color:#e6c65c;">Go to WhatsApp > Linked Devices > Link with phone number</p>
                    `;

                    countdownInterval = setInterval(() => {
                        timeLeft--;
                        let timerEl = document.getElementById('timer');
                        if (timerEl) {
                            timerEl.innerText = `Code expires in: ${timeLeft}s`;
                        }
                        if (timeLeft <= 0) {
                            clearInterval(countdownInterval);
                            if (timerEl) timerEl.innerText = "Code Expired! Generate a new one.";
                        }
                    }, 1000);

                } else {
                    resultContent.innerHTML = `<span style="color: #ff4d4d; font-family:'Orbitron'; font-size:12px;">Failed to generate code. Try again!</span>`;
                }
            } catch (e) {
                loader.style.display = 'none';
                resultBox.style.display = 'block';
                resultContent.innerHTML = `<span style="color: #ff4d4d; font-family:'Orbitron'; font-size:12px;">An error occurred. Server might be busy.</span>`;
            }
        }

        async function getQRCode() {
            let loader = document.getElementById('loader');
            let resultBox = document.getElementById('resultBox');
            let resultContent = document.getElementById('resultContent');

            loader.style.display = 'block';
            resultBox.style.display = 'none';
            resultContent.innerHTML = '';

            try {
                let res = await fetch(`/pair?type=qr`);
                let data = await res.json();
                
                loader.style.display = 'none';
                resultBox.style.display = 'block';

                if (data.qr) {
                    resultContent.innerHTML = `<span style="font-size:11px; color:#ffd700; font-family:'Orbitron'; letter-spacing:1px;">Scan QR Code:</span><br><img src="${data.qr}" alt="QR Code" class="qr-img">`;
                } else {
                    resultContent.innerHTML = `<span style="color: #ff4d4d; font-family:'Orbitron'; font-size:12px;">Failed to generate QR. Try again!</span>`;
                }
            } catch (e) {
                loader.style.display = 'none';
                resultBox.style.display = 'block';
                resultContent.innerHTML = `<span style="color: #ff4d4d; font-family:'Orbitron'; font-size:12px;">An error occurred. Server might be busy.</span>`;
            }
        }
    </script>
</body>
</html>
