<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHANEX-MD | Golden Matrix Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: #000; 
            color: #ffd700; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative;
        }

        /* Matrix Rain Canvas Background */
        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.25;
        }

        .container { 
            background: rgba(10, 10, 10, 0.9); 
            border: 2px solid #ffd700; 
            border-radius: 20px; 
            padding: 30px; 
            width: 100%; 
            max-width: 480px; 
            text-align: center; 
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.4); 
            backdrop-filter: blur(10px); 
            position: relative; 
            z-index: 1; 
            animation: fadeInContainer 1s ease-in-out;
        }

        @keyframes fadeInContainer {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Creator Profile Style */
        .creator-profile { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px; 
            margin-bottom: 20px; 
            background: rgba(30, 25, 5, 0.8); 
            padding: 10px 15px; 
            border-radius: 50px; 
            border: 1px solid #ffd700; 
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }
        .creator-avatar { 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid #ffd700; 
            box-shadow: 0 0 10px #ffd700; 
        }
        .creator-info { text-align: left; }
        .creator-info h3 { font-size: 14px; color: #ffd700; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        .creator-info p { font-size: 11px; color: #cca300; margin: 0; }

        h1 { font-family: 'Orbitron', sans-serif; color: #ffd700; font-size: 22px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
        .subtitle { color: #cca300; font-size: 12px; margin-bottom: 20px; font-family: 'Orbitron', sans-serif; }

        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #1a1700; border: 1px solid #665200; color: #cca300; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.3s; font-family: 'Orbitron', sans-serif; }
        .tab-btn.active { background: #ffd700; color: #000; border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); font-weight: 900; }

        .tab-content { display: none; animation: fadeInTab 0.5s ease-in-out; }
        .tab-content.active { display: block; }

        @keyframes fadeInTab {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 11px; color: #ffd700; margin-bottom: 5px; font-weight: 600; font-family: 'Orbitron', sans-serif; }
        input { width: 100%; padding: 12px 15px; background: #141200; border: 1px solid #665200; border-radius: 8px; color: #ffd700; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }

        button.action-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #ffd700, #ff8c00); border: none; border-radius: 8px; color: #000; font-weight: 900; font-size: 14px; cursor: pointer; transition: 0.3s; font-family: 'Orbitron', sans-serif; }
        button.action-btn:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }

        .result-box { margin-top: 20px; background: #141200; border-radius: 8px; padding: 15px; display: none; border: 1px dashed #ffd700; animation: slideUp 0.4s ease-out; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Clean Normal Font for Pairing Code */
        .code-display { 
            font-family: 'Poppins', sans-serif; 
            font-size: 24px; 
            font-weight: 600; 
            color: #00ff66; 
            letter-spacing: 3px; 
            margin-top: 8px; 
            background: rgba(0, 255, 102, 0.1);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 102, 0.3);
        }
        
        .timer-display { font-size: 12px; color: #ff4d4d; margin-top: 8px; font-family: 'Orbitron', sans-serif; }
        img.qr-img { max-width: 180px; border-radius: 8px; margin-top: 10px; border: 2px solid #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); animation: pulseQR 2s infinite alternate; }

        @keyframes pulseQR {
            from { transform: scale(1); box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
            to { transform: scale(1.03); box-shadow: 0 0 20px rgba(255, 215, 0, 0.7); }
        }
        
        .loader { border: 3px solid #332b00; border-top: 3px solid #ffd700; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 15px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .footer-credit { margin-top: 20px; font-size: 10px; color: #806600; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- Matrix Rain Background Animation -->
    <canvas id="matrixCanvas"></canvas>

    <div class="container">
        <!-- Creator Profile Section -->
        <div class="creator-profile">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" alt="Shanuka Umanga" class="creator-avatar">
            <div class="creator-info">
                <h3>SHANUKA UMANGA</h3>
                <p>Cyber Developer & Creator</p>
            </div>
        </div>

        <h1>⚡ SHANEX-MD ⚡</h1>
        <p class="subtitle">GOLDEN MATRIX PORTAL</p>
        
        <!-- Tabs Selection -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('pairing')">Pairing Code</button>
            <button class="tab-btn" onclick="switchTab('qr')">QR Code</button>
        </div>

        <!-- Pairing Code Tab -->
        <div id="pairingTab" class="tab-content active">
            <div class="input-group">
                <label>WhatsApp Number (with Country Code)</label>
                <input type="text" id="phone" placeholder="e.g., 9477xxxxxxx">
            </div>
            <button class="action-btn" onclick="getPairingCode()">GET PAIRING CODE</button>
        </div>

        <!-- QR Code Tab -->
        <div id="qrTab" class="tab-content">
            <button class="action-btn" onclick="getQRCode()">GENERATE QR CODE</button>
        </div>
        
        <div class="loader" id="loader"></div>

        <div class="result-box" id="resultBox">
            <div id="resultContent"></div>
        </div>

        <div class="footer-credit">POWERED BY SHANEX-MD SYSTEM</div>
    </div>

    <script>
        // Matrix Rain Effect Script
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const characters = '01SHANEXMDGOLDEN⚡🔥9477';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffd700'; // Golden color
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Tab Switching & Logic
        let countdownInterval;

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            clearInterval(countdownInterval);
            
            if(tab === 'pairing') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('pairingTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('qrTab').classList.add('active');
            }
            document.getElementById('resultBox').style.display = 'none';
        }

        async function getPairingCode() {
            let phone = document.getElementById('phone').value.trim();
            let loader = document.getElementById('loader');
            let resultBox = document.getElementById('resultBox');
            let resultContent = document.getElementById('resultContent');

            if (!phone) {
                alert('Please enter your WhatsApp number first!');
                return;
            }

            loader.style.display = 'block';
            resultBox.style.display = 'none';
            resultContent.innerHTML = '';
            clearInterval(countdownInterval);

            try {
                let res = await fetch(`/pair?number=${phone}&type=pairing`);
                let data = await res.json();
                
                loader.style.display = 'none';
                resultBox.style.display = 'block';

                if (data.code) {
                    let timeLeft = 60; // Expiration timer
                    resultContent.innerHTML = `
                        <span style="font-size:11px; color:#ffd700; font-family:'Orbitron';">Your Pairing Code:</span>
                        <div class="code-display">${data.code}</div>
                        <div class="timer-display" id="timer">Code expires in: ${timeLeft}s</div>
                        <p style="margin-top:8px; font-size:10px; color:#cca300;">Go to WhatsApp > Linked Devices > Link with phone number</p>
                    `;

                    countdownInterval = setInterval(() => {
                        timeLeft--;
                        let timerEl = document.getElementById('timer');
                        if (timerEl) {
                            timerEl.innerText = `Code expires in: ${timeLeft}s`;
                        }
                        if (timeLeft <= 0) {
                            clearInterval(countdownInterval);
                            if (timerEl) timerEl.innerText = "Code Expired! Generate a new one.";
                        }
                    }, 1000);

                } else {
                    resultContent.innerHTML = `<span style="color: #ff4d4d;">Failed to generate code. Try again!</span>`;
                }
            } catch (e) {
                loader.style.display = 'none';
                resultBox.style.display = 'block';
                resultContent.innerHTML = `<span style="color: #ff4d4d;">An error occurred. Server might be busy.</span>`;
            }
        }

        async function getQRCode() {
            let loader = document.getElementById('loader');
            let resultBox = document.getElementById('resultBox');
            let resultContent = document.getElementById('resultContent');

            loader.style.display = 'block';
            resultBox.style.display = 'none';
            resultContent.innerHTML = '';

            try {
                let res = await fetch(`/pair?type=qr`);
                let data = await res.json();
                
                loader.style.display = 'none';
                resultBox.style.display = 'block';

                if (data.qr) {
                    resultContent.innerHTML = `<span style="font-size:11px; color:#ffd700; font-family:'Orbitron';">Scan QR Code:</span><br><img src="${data.qr}" alt="QR Code" class="qr-img">`;
                } else {
                    resultContent.innerHTML = `<span style="color: #ff4d4d;">Failed to generate QR. Try again!</span>`;
                }
            } catch (e) {
                loader.style.display = 'none';
                resultBox.style.display = 'block';
                resultContent.innerHTML = `<span style="color: #ff4d4d;">An error occurred. Server might be busy.</span>`;
            }
        }
    </script>
</body>
</html>
